
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>❓ Question Answering with BERT</title>
  <meta name="description" content="Ask a question about a provided context and get an answer from a BERT model served via MLflow." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f4f6;
      --panel:#ffffff;
      --ink:#1e293b;
      --muted:#5b667a;
      --brand:#4CAF50;
      --brand-700:#3A8E40;
      --border: 1px solid rgba(2,6,23,.08);
      --radius: 14px;
      --shadow: 0 10px 30px rgba(2,6,23,.10);
      --focus: 0 0 0 3px rgba(76,175,80,.25);
    }
    *,*::before,*::after{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.6;
    }
    .wrap{ max-width: 860px; margin: 24px auto 40px; padding: 0 16px; }

    /* Logos row */
    .logos{
      display:flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.25rem; gap: 12px;
    }
    .logos img{ width: 90px; height: auto; }

    /* Header */
    .header{
      text-align: center;
      background: var(--panel);
      border: var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .header h1{
      margin: 0;
      color: #2C3E50;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
    }

    /* Card */
    .card{
      background: var(--panel);
      border: var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .label{ font-weight: 700; margin: 6px 0; display:block; }
    .input, textarea{
      width: 100%;
      background: #fff;
      border: 1px solid rgba(2,6,23,.12);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .input:focus, textarea:focus{ box-shadow: var(--focus); border-color: #c6e9c8; }
    textarea{ min-height: 110px; resize: vertical; }

    .row{ display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .btn{
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: transform .06s ease, filter .2s ease, opacity .2s;
      box-shadow: 0 10px 24px rgba(76,175,80,.25);
      font-size: 16px;
    }
    .btn:hover{ filter: brightness(1.05); }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity: .65; cursor: not-allowed; }

    .help{ color: var(--muted); font-size: 14px; }

    .alert{
      margin-top: 10px;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .alert.warn{ background: #fffce3; color: #5e4b00; border-color: #fff3a3; }
    .alert.error{ background: #fff0f0; color: #7a0b0b; border-color: #ffcaca; }
    .alert.info{ background: #eefaf0; color: #13521d; border-color: #c2efc9; }
    .alert.success{ background: #eefaf0; color: #13521d; border-color: #c2efc9; }

    .answer-box{
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
      margin: 10px 0px;
      border-left: 8px solid var(--brand);
    }
    .answer-box h4{ margin: 0; color: #2C3E50; }

    footer{ opacity:.85; text-align:center; padding:28px 16px 40px; color:var(--muted); }
    footer a{ color:#a8d8ff; text-decoration: underline; }

    hr{ border: none; border-top: 1px solid rgba(2,6,23,.12); margin: 16px 0; }

    @media (max-width: 560px){
      .logos img{ width: 64px; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="header">
      <h1>❓ Question Answering with BERT</h1>
    </header>

    <section class="card">
      <div>
        <label class="label" for="context">Put a context:</label>
        <textarea id="context" placeholder="Paste the context paragraph here..."></textarea>
      </div>

      <div style="margin-top: 10px;">
        <label class="label" for="question">Ask a question:</label>
        <input id="question" class="input" type="text" placeholder="Type your question..." />
      </div>

      <div class="row" style="margin-top: 14px;">
        <button id="btn-answer" class="btn">Get answer</button>
      </div>

      <div id="alert-host"></div>

      <div id="result-wrap" style="display:none;">
        <div class="alert success">✅ Here is your answer!</div>
        <div class="answer-box">
          <h4 id="answer-line">answer: N/A<br>score: 0.00</h4>
        </div>
      </div>

      <hr />

      <footer>
        <div><em>📄✨ BERT Question Answering with AI Studio © 2025</em></div>
        <div>Built with ❤️ using <a href="https://hp.com/ai-studio" target="_blank" rel="noopener">HP AI Studio</a>.</div>
      </footer>


    </section>
  </div>

  <script>
    // Config
    const API_URL = "/invocations";

    // Helpers
    const qs = (s, c=document) => c.querySelector(s);
    function setAlert(kind, msg){
      const host = qs("#alert-host");
      if(!msg){ host.innerHTML = ""; return; }
      host.innerHTML = `<div class="alert ${kind}">${msg}</div>`;
    }
    function spinner(msg="Generating..."){
      setAlert("info", msg);
    }
    function fmtScore(n){
      const num = Number(n);
      if(Number.isFinite(num)){
        return num.toFixed(2);
      }
      return "0.00";
    }

    function parseRecord(obj){
      // Streamlit logic: rec = predictions | dataframe_records | data; if list take first
      if(!obj) return null;
      let rec = obj.predictions ?? obj.dataframe_records ?? obj.data;
      if(Array.isArray(rec)) rec = rec[0];
      if(rec && typeof rec === "object") return rec;
      return null;
    }

    // Wire up
    qs("#endpoint").textContent = API_URL;

    qs("#btn-answer").addEventListener("click", async () => {
      const context = (qs("#context").value || "").trim();
      const question = (qs("#question").value || "").trim();

      // Validation: both required
      if(!context || !question){
        setAlert("warn", "⚠️ Please fill all the fields");
        return;
      }

      // Build payload per Streamlit logic
      const payload = { inputs: { context: [context], question: [question] } };

      try{
        spinner("Generating...");
        qs("#btn-answer").disabled = true;

        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if(!res.ok){
          const t = await res.text().catch(() => "");
          throw new Error(t || `HTTP ${res.status}`);
        }
        const data = await res.json();

        // Extract answer dict
        const rec = parseRecord(data);
        if(rec && typeof rec === "object"){
          const answerText = rec.answer ?? rec.original ?? rec.text ?? "N/A";
          const score = fmtScore(rec.score ?? rec.confidence ?? 0.0);

          qs("#answer-line").innerHTML = `answer: ${escapeHtml(answerText)}<br>score: ${score}`;
          qs("#result-wrap").style.display = "block";
          setAlert(); // clear alerts
        }else{
          setAlert("error", "❌ Unexpected response format. Please try again.");
          qs("#result-wrap").style.display = "none";
        }
      }catch(err){
        console.error(err);
        setAlert("error", `❌ Error fetching generated text. ${err.message || err}`);
        qs("#result-wrap").style.display = "none";
      }finally{
        qs("#btn-answer").disabled = false;
      }
    });

    function escapeHtml(str){
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
