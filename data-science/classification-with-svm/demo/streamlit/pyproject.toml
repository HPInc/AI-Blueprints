[tool.poetry]
name = "classification-with-svm-streamlit"
version = "0.1.0"
description = "Streamlit demo for Classification with SVM blueprint"
authors = ["HP AI Studio <datastudio@hp.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
streamlit = "^1.28.0"
pandas = "^2.0.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
