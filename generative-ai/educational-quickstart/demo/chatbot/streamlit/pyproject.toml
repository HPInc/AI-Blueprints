[tool.poetry]
name = "educational-quickstart-chatbot-webapp"
version = "0.1.0"
description = "Streamlit front-end for the AIStudio-EQ-Chatbot Blueprint"
authors = ["HP AI Studio <ai-studio@hp.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
streamlit = ">=1.54.0,<2.0.0"
pillow = "12.3.0"
urllib3 = ">=2.7.0"
requests = ">=2.32.0"
GitPython = "3.1.57"
idna = "3.15"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
