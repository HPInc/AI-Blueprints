[tool.poetry]
name = "agentic-github-repo-analyzer-streamlit-webapp"
version = "0.1.0"
description = "A Streamlit front-end for AIS Agentic GitHub Repo Analyzer with LangGraph Blueprint Project"
authors = ["Ata Turhan <ata.turhan@hp.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
streamlit = ">=1.54.0,<2.0.0"
pillow = "12.2.0"
urllib3 = ">=2.7.0"
langchain-core = "1.3.3"
langchain = "1.0.4"
langchain-community = "0.4.1"
langchain-classic = "1.0.7"
unstructured = "0.18.18"
pypdf = "6.12.0"
python-docx = "1.2.0"
msoffcrypto-tool = "5.4.2"
openpyxl = "3.1.5"
GitPython = "3.1.50"
idna = "3.15"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
